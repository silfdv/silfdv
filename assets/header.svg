<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Silvio Duarte — Matemático · Consultor de TI y de IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.55" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4fd1c5"/>
    </linearGradient>
    <style>
      .name  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: 10px; }
      .kick  { font-family: 'Consolas', 'SF Mono', 'Courier New', monospace; letter-spacing: 4px; }
      .sub   { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; letter-spacing: 3px; }
      .tag   { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-style: italic; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- motivo de red / sistemas, sutil -->
  <g stroke="#4fd1c5" stroke-width="1" opacity="0.16" fill="none">
    <path d="M60 250 L180 200 L300 235 L120 150 L240 120"/>
    <path d="M1140 60 L1020 105 L900 70 L1080 150 L960 175"/>
  </g>
  <g fill="#38bdf8" opacity="0.22">
    <circle cx="60" cy="250" r="4"/><circle cx="180" cy="200" r="4"/><circle cx="300" cy="235" r="4"/>
    <circle cx="120" cy="150" r="4"/><circle cx="240" cy="120" r="4"/>
    <circle cx="1140" cy="60" r="4"/><circle cx="1020" cy="105" r="4"/><circle cx="900" cy="70" r="4"/>
    <circle cx="1080" cy="150" r="4"/><circle cx="960" cy="175" r="4"/>
  </g>

  <text x="600" y="88" text-anchor="middle" class="kick" font-size="15" fill="url(#accent)">// QA · INFRAESTRUCTURA CLOUD · BUSINESS INTELLIGENCE</text>

  <text x="600" y="160" text-anchor="middle" class="name" font-size="62" fill="#ffffff">SILVIO DUARTE</text>

  <g transform="translate(600 196)">
    <line x1="-150" y1="0" x2="-24" y2="0" stroke="#4fd1c5" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="3.5" fill="#4fd1c5"/>
    <line x1="24" y1="0" x2="150" y2="0" stroke="#4fd1c5" stroke-width="1.5" opacity="0.6"/>
  </g>

  <text x="600" y="228" text-anchor="middle" class="sub" font-size="21" fill="#e2f1f4">Matemático · Consultor de TI y de IA</text>

  <text x="600" y="264" text-anchor="middle" class="tag" font-size="18" fill="#9fc4cf">Sistemas que funcionan — y siguen funcionando</text>
</svg>
