      .sub   { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; letter-spacing: 3px; }
      .tag   { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-style: italic; }
      .rise  { animation: rise 1.1s ease-out both; }
      .d1 { animation-delay: .05s } .d2 { animation-delay: .2s } .d3 { animation-delay: .35s } .d4 { animation-delay: .5s }
      @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
